org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# The checkout lives under a non-ASCII path (D:\项目\deepcook). AGP refuses such paths by
# default; this is the documented opt-out. Builds and packaging work here, and moving the
# project to an ASCII path is never required.
android.overridePathCheck=true
